
<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#222;
    background:#fff;
    line-height:1.6;
}

header{
    height:90px;
    background:#fff;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    z-index:1000;
}

.header-inner{
    height:100%;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo-link{
    display:flex;
    align-items:center;
    height:100%;
}

.logo{
    display:block;
    height:88px;
    width:auto;
    max-width:750px;
    object-fit:contain;
}

nav{
    display:flex;
    align-items:center;
    gap:32px;
}

nav a{
    color:#222;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

.menu-toggle{
    display:none;
    background:none;
    border:0;
    font-size:28px;
    cursor:pointer;
}

.project-header{
    text-align:center;
    padding:55px 20px 35px;
}

.project-header .category{
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#888;
}

.project-header h1{
    font-size:36px;
    margin:8px 0;
}

.project-header p{
    color:#777;
}

/* PHOTO GALLERY */
.gallery{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:15px 20px 70px;
}

.gallery img{
    display:block;
    width:100%;
    height:auto;
    margin:0 auto 25px;
    object-fit:contain;
    background:#f5f5f5;
}

.back-link{
    display:block;
    text-align:center;
    margin:0 auto 55px;
    color:#222;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

footer{
    background:#171717;
    color:#fff;
    text-align:center;
    padding:35px 20px;
}

.footer-logo{
    height:200px;
    max-width:650px;
    width:auto;
    object-fit:contain;
    display:block;
    margin:0 auto 18px;
}

footer p{
    font-size:13px;
    color:#ccc;
    margin:5px 0;
}

footer a{
    color:#fff;
    text-decoration:none;
}

@media(max-width:850px){

    header{
        height:65px;
    }

    .header-inner{
        padding:0 10px;
    }

    .logo{
        height:63px;
        max-width:500px;
    }

    .menu-toggle{
        display:block;
    }

    nav{
        display:none;
        position:absolute;
        top:65px;
        left:0;
        width:100%;
        background:#fff;
        padding:18px 20px;
        flex-direction:column;
        align-items:flex-start;
        gap:18px;
        border-bottom:1px solid #eee;
    }

    nav.open{
        display:flex;
    }

    .project-header{
        padding:38px 16px 25px;
    }

    .project-header h1{
        font-size:28px;
    }

    .gallery{
        padding:10px 12px 45px;
    }

    .gallery img{
        margin-bottom:16px;
    }

    .footer-logo{
        height:150px;
        max-width:500px;
    }
}
</style>
</head>
